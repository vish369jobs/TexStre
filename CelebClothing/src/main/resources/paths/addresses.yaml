# ADD/CREATE Address API
add_address:
  post:
    summary: Add a new Delivery Address
    operationId: createDeliveryAddress
    requestBody:
      description: Create a new Delivery Address
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DeliveryAddress"
    responses:
      "201":
        description: Created
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"

# GET Address API
get_address:
  get:
    summary: Get a delivery address by userId
    operationId: fetchAddressesByUserId
    parameters:
      - in: path
        name: userId
        required: true
        schema:
          type: integer
          minimum: 1
          description: The identifier of the user.
    responses:
      "200":
        description: A list of delivery addresses for the given userId
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"

# UPDATE Address API
update_address:
  put:
    summary: Update a delivery address by addressId
    operationId: updAddressByAddressId
    parameters:
      - in: path
        name: addressId
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
          description: The identifier for the address.
    requestBody:
      description: Update additional details of a Delivery Address
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DeliveryAddress"
    responses:
      "200":
        description: Update the delivery address for the given addressId
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"

# DELETE Address API
delete_address:
  delete:
    summary: Delete a delivery address by addressId
    operationId: deleteAddressesById
    parameters:
      - in: path
        name: addressIdToDel
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
          description: The identifier for the address.
    responses:
      "200":
        description: Delete the delivery address indicated by deleteAddressesById
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiResponse"
