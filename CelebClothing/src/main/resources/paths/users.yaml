post:
  summary: Create a new user to the eCommerce application
  requestBody:
    description: User details
    required: true
    content:
      application/json:
        schema:
          User:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              Gender:
                type: string
  responses:
    '201':
      description: Created User Successfully
    '400':
      description: User already exists